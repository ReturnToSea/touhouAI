site_name: th07 Agent Handbook
site_description: >-
  Technical reference and postmortem for the Touhou 7 (Perfect Cherry Blossom)
  reinforcement-learning agent.
site_url: https://returntosea.github.io/touhouAI/
repo_url: https://github.com/ReturnToSea/touhouAI
repo_name: ReturnToSea/touhouAI
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: "working draft"

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: "Theme: follow system"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-7
        name: "Theme: light"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: "Theme: dark"
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Overview: index.md
  - "Part 1 · The problem":
      - "1 · The game": ch-game.md
      - "2 · The goal & the approach": ch-goal.md
  - "Part 2 · The agent":
      - "3 · What the agent sees": obs.md
      - "4 · The policy network": ch-policy.md
      - "5 · How it learns": ppo.md
  - "Part 3 · The world":
      - "6 · Talking to the game": hook.md
      - "7 · The environment": env.md
      - "8 · Bullet physics & collision": collision.md
  - "Part 4 · Training in simulation":
      - "9 · The danmaku simulator": sim.md
      - "10 · Recording real bosses": recording.md
      - "11 · The transfer ceiling": ceiling.md
  - "Part 5 · The plan":
      - "12 · The ECL format": ecl.md
      - "13 · Generative danmaku": ecl-vm.md
  - "Results": results.md
  - "Extras":
      - dead-ends.md
      - "Training & reward lessons":
          - ex-training.md
          - "Bolting shooting onto survival": de-shooting.md
          - "Observation normalization": de-obsnorm.md
          - "Ranking checkpoints by sim score": de-checkpoints.md
          - "Real-game fine-tuning": de-realgame.md
      - "Reproducing real danmaku":
          - ex-danmaku.md
          - "The first ECL interpreter": de-ecl-vm.md
          - "Porting Letty into the sim": de-letty-replay.md
          - "The re-aim saga": de-reaim.md
          - "Choosing a proof-of-concept boss": de-poc.md
      - "Engine internals":
          - ex-internals.md
          - "Reverse-engineering th07": re.md
          - "Address reference": reference.md
      - "Experiment log": experiment-log.md
